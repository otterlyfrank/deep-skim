<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deep-Skim">
  <defs>
    <linearGradient id="gold" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8b56e"/>
      <stop offset="1" stop-color="#a07f38"/>
    </linearGradient>
    <linearGradient id="fur" x1="20" y1="10" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7a5338"/>
      <stop offset="1" stop-color="#4a3020"/>
    </linearGradient>
    <linearGradient id="pageL" x1="12" y1="30" x2="30" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffcf5"/>
      <stop offset="1" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="pageR" x1="34" y1="30" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f0e2"/>
      <stop offset="1" stop-color="#e8dcc6"/>
    </linearGradient>
  </defs>

  <!-- outer bezel -->
  <rect width="64" height="64" rx="14" fill="#12100e"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#3a342c" stroke-width="1.5"/>
  <!-- gold field -->
  <rect x="7" y="7" width="50" height="50" rx="11" fill="url(#gold)"/>

  <!-- otter head -->
  <ellipse cx="32" cy="23" rx="15" ry="12" fill="url(#fur)"/>
  <ellipse cx="18.5" cy="17" rx="3.2" ry="4" fill="#5a3c28"/>
  <ellipse cx="45.5" cy="17" rx="3.2" ry="4" fill="#5a3c28"/>
  <!-- eyes -->
  <ellipse cx="26" cy="22" rx="4.2" ry="4.4" fill="#f7f0e6"/>
  <ellipse cx="38" cy="22" rx="4.2" ry="4.4" fill="#f7f0e6"/>
  <circle cx="26.4" cy="22.4" r="2.2" fill="#1a1410"/>
  <circle cx="38.4" cy="22.4" r="2.2" fill="#1a1410"/>
  <circle cx="27.1" cy="21.6" r="0.75" fill="#fff"/>
  <circle cx="39.1" cy="21.6" r="0.75" fill="#fff"/>
  <!-- snout / smile peeking above book -->
  <ellipse cx="32" cy="28.5" rx="5" ry="3.2" fill="#c4a07a"/>
  <path d="M29 29.5c1.2 1.3 4.8 1.3 6 0" fill="none" stroke="#5a3c28" stroke-width="1.1" stroke-linecap="round"/>

  <!--
    Continuous open book — NO black gap.
    Single paper shape with soft V gutter (cream fold shadow only).
  -->
  <!-- page stack edge (left) -->
  <path fill="#e8dfc8" d="M11 36c0-1 0.6-1.6 1.4-1.8L30 30.5v24.5L12.2 58.2C11.2 58.5 10.5 57.8 10.5 56.8V37c0-0.5 0.2-0.9 0.5-1z"/>
  <!-- page stack edge (right) -->
  <path fill="#ddd2b8" d="M53 36c0-1-0.6-1.6-1.4-1.8L34 30.5v24.5l17.8 3.2c1 0.3 1.7-0.4 1.7-1.4V37c0-0.5-0.2-0.9-0.5-1z"/>

  <!-- continuous open spread (joined at center) -->
  <path fill="url(#pageL)" d="
    M12.5 34.5
    L31 30
    L31 55.5
    L13 58
    C12 58.2 11.5 57.6 11.5 56.6
    V36
    C11.5 35 12 34.5 12.5 34.5
    Z"/>
  <path fill="url(#pageR)" d="
    M51.5 34.5
    L33 30
    L33 55.5
    L51 58
    C52 58.2 52.5 57.6 52.5 56.6
    V36
    C52.5 35 52 34.5 51.5 34.5
    Z"/>

  <!-- soft cream gutter (not black): center fold -->
  <path fill="#e0d4bc" d="M30.2 30.2 L33.8 30.2 L33.8 55.8 L30.2 55.8 Z" opacity="0.95"/>
  <path d="M32 30.5 V55.5" stroke="#c4a35a" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
  <!-- subtle page curl highlights -->
  <path d="M14 35.5 Q22 33 30.5 32" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <path d="M50 35.5 Q42 33 33.5 32" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>

  <!-- skim lines -->
  <path d="M16 40h10 M16 44h12 M16 48h9" stroke="#b8954a" stroke-width="1.35" stroke-linecap="round" opacity="0.85"/>
  <path d="M38 40h10 M36 44h12 M39 48h9" stroke="#9a7b35" stroke-width="1.35" stroke-linecap="round" opacity="0.8"/>
</svg>
