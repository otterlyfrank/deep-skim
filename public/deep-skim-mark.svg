      <stop offset="1" stop-color="#9a7b35"/>
    </linearGradient>
    <linearGradient id="fur" x1="16" y1="12" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b4a34"/>
